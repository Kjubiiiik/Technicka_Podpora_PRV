<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora – VDF Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Technická podpora – VDF Games</h1>
        <p class="subtitle">Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>

        <form>
            <div class="form-group">
                <label for="dotaz">Tvůj dotaz:*</label>
                <textarea id="dotaz" rows="4" placeholder="Např.: Po poslední aktualizaci se mi hra nespustí..."></textarea>
            </div>

            <div class="form-group">
                <label for="email">E-mail (nepovinné):</label>
                <input type="email" id="email" placeholder="tvuj@email.cz">
            </div>

            <button type="submit" class="btn">Odeslat dotaz</button>
        </form>

        <div class="response-section">
            <h2>Odpověď podpory:</h2>
            <div class="response-box">
                Zatím žádný dotaz.
            </div>
        </div>
    </div>

</body>
</html>
